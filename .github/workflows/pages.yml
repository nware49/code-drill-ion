name: Deploy site

# Publishes the game to GitHub Pages: on every push to main, when a puzzle is approved
# (the review workflow dispatches this), and daily so tomorrow's approved puzzle goes live.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        run: node scripts/build.mjs --site dist/site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - id: deployment
        uses: actions/deploy-pages@v4
