name: Deploy site

# Publishes the game to GitHub Pages: on every push to main, when a puzzle is approved
# (the review workflow dispatches this), and daily so tomorrow's approved puzzle goes live.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs, as in GitHub's own Pages templates. Deploying in the
  # same job a second after the upload sometimes finds no artifact ("Found 0 artifact(s)").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        run: node scripts/build.mjs --site dist/site
        env:
          # Written into js/posthog-config.js. Without them the site deploys with analytics off.
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
