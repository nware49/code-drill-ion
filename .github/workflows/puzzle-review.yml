name: Puzzle review

# Applies /approve, /hold, /release, /reroll and /swap N comments and reviews on puzzle and
# bank pull requests, and merges anything whose 24-hour window passed without feedback.
on:
  schedule:
    - cron: '23 * * * *' # hourly
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  id-token: write # Workload Identity Federation, for /reroll and /swap

concurrency:
  group: puzzle-review-${{ github.event.issue.number || github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply commands and the review window
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--scheduled' || '--event' }}
        run: node scripts/review-puzzles.mjs "$MODE"

      - name: Regenerate the puzzle (/reroll or /swap)
        if: steps.review.outputs.rework != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.review.outputs.rework }}
          SLOT: ${{ steps.review.outputs.slot }}
          PR: ${{ steps.review.outputs.pr }}
          BRANCH: ${{ steps.review.outputs.branch }}
          DATE: ${{ steps.review.outputs.date }}
        run: |
          git fetch origin '+refs/heads/puzzle/*:refs/remotes/origin/puzzle/*'
          git switch "$BRANCH"
          if [ "$MODE" = swap ]; then node scripts/plan-puzzle.mjs --date "$DATE" --swap "$SLOT" --body "$RUNNER_TEMP/pr.md"
          else node scripts/plan-puzzle.mjs --date "$DATE" --reroll --body "$RUNNER_TEMP/pr.md"; fi
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Puzzle $DATE: $MODE $SLOT"
          git push origin "$BRANCH"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/pr.md" --remove-label hold || gh pr edit "$PR" --body-file "$RUNNER_TEMP/pr.md"
          gh pr comment "$PR" --body "Done. The table above shows the new puzzle, and the 24-hour window has restarted."
